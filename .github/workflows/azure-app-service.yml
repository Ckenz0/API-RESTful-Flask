name: API Flask CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testar API e colecao Postman
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar dependencias e executar testes
        run: |
          python -m pip check
          python -m unittest discover -s tests -v

      - name: Executar colecao Postman com Gunicorn
        run: |
          sh startup.sh > gunicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/api/mensagens > /dev/null
          npx --yes newman@6.2.3 run postman/messages-api.postman_collection.json --env-var baseUrl=http://127.0.0.1:8000 --reporters cli,junit --reporter-junit-export reports/postman-local.xml --timeout-request 15000

      - name: Salvar resultado da colecao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-local
          path: reports/postman-local.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Empacotar API
        run: python -m zipfile -c release.zip app.py requirements.txt startup.sh

      - uses: actions/upload-artifact@v4
        with:
          name: flask-api
          path: |
            release.zip
            postman/messages-api.postman_collection.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publicar e testar no Azure
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: azure-api-production
      cancel-in-progress: false
    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
    steps:
      - name: Validar configuracao
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_249D317F020E4E53A75149FD65ED73E7 }}
          AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_2F9ADF9D15E9459BADCF64306BF9656F }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4E9F7C0527464F9B913CB00DCD727A79 }}
        run: |
          if [ -z "$AZURE_WEBAPP_NAME" ]; then
            echo '::error::Configure a variavel AZURE_WEBAPP_NAME no repositorio.'
            exit 1
          fi
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo '::error::Confira as credenciais OIDC configuradas pela Central de Implantacao do Azure.'
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: flask-api

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Autenticar no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_249D317F020E4E53A75149FD65ED73E7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2F9ADF9D15E9459BADCF64306BF9656F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4E9F7C0527464F9B913CB00DCD727A79 }}

      - name: Habilitar instalacao de dependencias no Azure
        run: |
          resource_group=$(az webapp list --query "[?name=='$AZURE_WEBAPP_NAME'].resourceGroup | [0]" --output tsv)
          if [ -z "$resource_group" ]; then
            echo '::error::App Service nao encontrado na assinatura configurada.'
            exit 1
          fi
          az webapp config appsettings set --name "$AZURE_WEBAPP_NAME" --resource-group "$resource_group" --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true --output none

      - name: Fazer deploy
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: release.zip
          startup-command: sh startup.sh

      - name: Aguardar API e executar colecao Postman
        env:
          WEBAPP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          base_url="${WEBAPP_URL%/}"
          ready=false
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 20 "$base_url/api/mensagens" > /dev/null; then
              ready=true
              break
            fi
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo '::error::A API nao respondeu apos o deploy.'
            exit 1
          fi
          npx --yes newman@6.2.3 run postman/messages-api.postman_collection.json --env-var "baseUrl=$base_url" --reporters cli,junit --reporter-junit-export reports/postman-azure.xml --timeout-request 30000

      - name: Salvar resultado da colecao no Azure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-azure
          path: reports/postman-azure.xml
          if-no-files-found: ignore
          retention-days: 7
